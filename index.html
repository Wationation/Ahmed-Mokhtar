<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="صيدلية احمد مختار" />
    <meta name="theme-color" content="#012cc8" />
    <title>احمد مختار | صيدلية</title>

    <!-- Apply saved theme + language before first paint (no flash of wrong theme/direction). -->
    <script>
      (function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('am-theme')
          if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          root.dataset.theme = theme
          var lang = localStorage.getItem('am-lang')
          if (lang === 'en') {
            root.lang = 'en'
            root.dir = 'ltr'
            document.title = 'احمد مختار | Pharmacy'
          }
        } catch (e) {}
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
